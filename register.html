<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — BestGames</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page">

  <!-- Шапка сайта -->
  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="header__brand">
        <div class="header__logo-slot">
          <img src="img/logo.png" alt="Логотип" class="header__logo-img">
        </div>
        <span class="header__brand-title">BestGames</span>
      </a>

      <input type="checkbox" id="burger-reg" class="header__burger-checkbox">
      <label for="burger-reg" class="header__burger-btn" aria-label="Меню">
        <span class="header__burger-line"></span>
        <span class="header__burger-line"></span>
        <span class="header__burger-line"></span>
      </label>

      <nav class="header__nav">
        <a href="index.html#search" class="header__nav-link">Поиск</a>
        <a href="catalog.html" class="header__nav-link">Каталог игр</a>
        <a href="profile.html" class="header__nav-link">Личный кабинет</a>
        <a href="login.html" class="btn">Войти</a>
      </nav>
    </div>
  </header>

  <!-- Форма регистрации (все поля обязательные) -->
  <main class="main section">
    <div class="container">
      <div class="form-card">
        <h1 class="section__title">Регистрация аккаунта</h1>
        <form action="profile.html" method="get">
          <div class="form-card__group">
            <label for="reg-email" class="form-card__label">E-mail *</label>
            <input type="email" id="reg-email" name="email" class="form-card__input" placeholder="name@example.com" required>
          </div>

          <div class="form-card__group">
            <label for="reg-lastname" class="form-card__label">Фамилия *</label>
            <input type="text" id="reg-lastname" name="lastname" class="form-card__input" placeholder="Иванов" required>
          </div>

          <div class="form-card__group">
            <label for="reg-firstname" class="form-card__label">Имя *</label>
            <input type="text" id="reg-firstname" name="firstname" class="form-card__input" placeholder="Алексей" required>
          </div>

          <div class="form-card__group">
            <label for="reg-birthdate" class="form-card__label">Дата рождения *</label>
            <input type="date" id="reg-birthdate" name="birthdate" class="form-card__input" required>
          </div>

          <div class="form-card__group">
            <label for="reg-phone" class="form-card__label">Номер телефона *</label>
            <input type="tel" id="reg-phone" name="phone" class="form-card__input" placeholder="+7 (999) 000-00-00" required>
          </div>

          <div class="form-card__group">
            <label for="reg-pass" class="form-card__label">Пароль *</label>
            <input type="password" id="reg-pass" name="password" class="form-card__input" required>
          </div>

          <div class="form-card__group">
            <label for="reg-pass-repeat" class="form-card__label">Повтор пароля *</label>
            <input type="password" id="reg-pass-repeat" name="password_repeat" class="form-card__input" required>
          </div>

          <div class="form-card__group">
            <label class="form-card__check">
              <input type="checkbox" name="consent" required>
              <span>Согласен на обработку персональных данных *</span>
            </label>
          </div>

          <div class="form-card__actions">
            <button type="submit" class="btn btn--full">Зарегистрироваться</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Подвал сайта -->
  <footer class="footer">
    <div class="container footer__grid">
      <div>
        <h3 class="footer__col-title">Контакты</h3>
        <ul class="footer__list">
          <li><a href="tel:88009995599" class="footer__link">Телефон: 8-800-999-55-99</a></li>
          <li><a href="mailto:best@games.ru" class="footer__link">E-mail: best@games.ru</a></li>
        </ul>
      </div>
      <div>
        <h3 class="footer__col-title">Информация</h3>
        <ul class="footer__list">
          <li><a href="#" class="footer__link">Клиентам</a></li>
          <li><a href="#" class="footer__link">Партнерам</a></li>
          <li><a href="#" class="footer__link">О нас</a></li>
          <li><a href="#" class="footer__link">Контакты</a></li>
        </ul>
      </div>
      <div>
        <h3 class="footer__col-title">Навигация по сайту</h3>
        <ul class="footer__list">
          <li><a href="index.html" class="footer__link">Главная</a></li>
          <li><a href="register.html" class="footer__link">Регистрация</a></li>
          <li><a href="login.html" class="footer__link">Авторизация</a></li>
          <li><a href="profile.html" class="footer__link">Личный кабинет</a></li>
          <li><a href="index.html#search" class="footer__link">Поиск</a></li>
        </ul>
      </div>
    </div>
  </footer>

</body>
</html>
